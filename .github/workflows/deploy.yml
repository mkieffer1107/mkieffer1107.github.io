name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Configure the Pages environment
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --- Rust and Wasm Setup ---
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm package (runtime)
        working-directory: ./rust
        run: wasm-pack build --target web --out-dir ../public/pkg --out-name mcts_game_pkg

      - name: Create lib/pkg for Wasm types
        run: mkdir -p ./lib/pkg

      - name: Copy Wasm package for types
        run: cp -r ./public/pkg/. ./lib/pkg/

      # --- Node.js and pnpm Setup ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build

      # Upload as a Pages artifact (now v3)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
